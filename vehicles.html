<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GTA RP — Гараж</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#48f477;
    --bg:#07090c;
    --panel:#101419;
    --panel2:#151a20;
    --border:#2d343c;
    --text:#f4f6f7;
    --muted:#89939d;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 75% 10%,
            #18241c 0,
            transparent 32%
        ),
        #07090c;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}


/* HEADER */

header{
    height:68px;

    display:flex;
    align-items:center;

    padding:0 28px;

    background:#080b0eee;

    border-bottom:1px solid var(--border);
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--green);
}

.title{
    margin-left:28px;
    padding-left:28px;

    border-left:1px solid var(--border);

    font-size:13px;
    font-weight:800;
}

.account{
    margin-left:auto;

    color:var(--muted);

    font-size:10px;
}

.back{
    margin-left:18px;

    padding:10px 16px;

    border:1px solid var(--border);
    border-radius:7px;

    background:#151a20;
    color:white;

    cursor:pointer;

    font-size:10px;
    font-weight:900;
}

.back:hover{
    background:#20272e;
}


/* MAIN */

main{
    max-width:1250px;
    margin:auto;

    padding:30px;
}


/* TOP */

.page-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    margin-bottom:20px;
}

.page-title{
    font-size:26px;
    font-weight:900;
}

.page-subtitle{
    margin-top:6px;

    color:var(--muted);

    font-size:11px;
}

.add-car{
    padding:12px 18px;

    border:0;
    border-radius:8px;

    background:var(--green);
    color:#061008;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

.add-car:hover{
    filter:brightness(.94);
}


/* GARAGE */

.garage{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}


/* CAR CARD */

.car{
    overflow:hidden;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--panel);
}

.car-image{

    height:190px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle,
            #283039 0,
            #101419 65%
        );

    font-size:75px;
}

.car-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.car-status{

    position:absolute;

    top:12px;
    left:12px;

    padding:6px 8px;

    border-radius:5px;

    background:#07100be8;

    color:var(--green);

    font-size:8px;
    font-weight:900;
}

.car-body{
    padding:17px;
}

.car-name{
    font-size:17px;
    font-weight:900;
}

.car-model{
    margin-top:5px;

    color:var(--muted);

    font-size:9px;
}

.car-stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:15px;
}

.car-stat{

    padding:9px;

    border-radius:6px;

    background:var(--panel2);
}

.car-stat-label{

    color:#69737e;

    font-size:7px;
}

.car-stat-value{

    margin-top:4px;

    font-size:10px;
    font-weight:900;
}

.car-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:13px;
}

.car-button{

    padding:10px;

    border:1px solid var(--border);

    border-radius:6px;

    background:#171c22;

    color:white;

    cursor:pointer;

    font-size:8px;
    font-weight:900;
}

.car-button:hover{
    background:#222930;
}

.car-button.primary{

    border-color:var(--green);

    background:var(--green);

    color:#061008;
}


/* EMPTY */

.empty{

    grid-column:1/-1;

    min-height:350px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    border:1px dashed #394149;
    border-radius:12px;

    background:#0c1014;
}

.empty-icon{

    width:85px;
    height:85px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#171d22;

    font-size:42px;
}

.empty-title{

    margin-top:18px;

    font-size:17px;
    font-weight:900;
}

.empty-text{

    max-width:390px;

    margin-top:8px;

    color:var(--muted);

    text-align:center;

    font-size:10px;
    line-height:1.5;
}

.empty-button{

    margin-top:18px;

    padding:12px 20px;

    border:0;
    border-radius:7px;

    background:var(--green);

    color:#061008;

    cursor:pointer;

    font-size:9px;
    font-weight:900;
}


/* GARAGE INFO */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:25px;
}

.info-card{

    padding:17px;

    border:1px solid var(--border);
    border-radius:9px;

    background:var(--panel);
}

.info-label{

    color:var(--muted);

    font-size:8px;
}

.info-value{

    margin-top:7px;

    font-size:17px;
    font-weight:900;
}


/* MODAL */

.modal{

    position:fixed;

    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    z-index:500;

    background:#000b;

    backdrop-filter:blur(5px);
}

.modal.open{
    display:flex;
}

.modal-box{

    width:min(430px,calc(100% - 30px));

    padding:24px;

    border:1px solid var(--border);
    border-radius:12px;

    background:#101419;

    box-shadow:
        0 25px 80px #000c;
}

.modal-title{

    font-size:18px;
    font-weight:900;
}

.modal-text{

    margin-top:9px;

    color:var(--muted);

    font-size:10px;
    line-height:1.5;
}

.modal-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:20px;
}

.modal-button{

    padding:11px;

    border:1px solid var(--border);
    border-radius:7px;

    background:#171c22;
    color:white;

    cursor:pointer;

    font-size:9px;
    font-weight:900;
}

.modal-button.primary{

    border-color:var(--green);

    background:var(--green);

    color:#061008;
}


/* MOBILE */

@media(max-width:850px){

    main{
        padding:18px;
    }

    .garage{
        grid-template-columns:
            repeat(2,1fr);
    }

    .info-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:550px){

    header{
        height:58px;
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .title{
        display:none;
    }

    .account{
        font-size:9px;
    }

    .back{
        margin-left:10px;
        padding:9px;
    }

    main{
        padding:13px;
    }

    .page-top{
        align-items:flex-start;
        flex-direction:column;
        gap:13px;
    }

    .page-title{
        font-size:22px;
    }

    .add-car{
        width:100%;
    }

    .garage{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

<body>


<header>

    <div class="logo">
        GTA <span>RP</span>
    </div>

    <div class="title">
        ГАРАЖ
    </div>

    <div
        class="account"
        id="accountName"
    >
        Tomas_RP
    </div>

    <button
        class="back"
        onclick="goBack()"
    >
        ← НАЗАД
    </button>

</header>


<main>


    <div class="page-top">

        <div>

            <div class="page-title">
                Мой гараж
            </div>

            <div class="page-subtitle">
                Управление личным транспортом
            </div>

        </div>

        <button
            class="add-car"
            onclick="openShop()"
        >
            + КУПИТЬ АВТОМОБИЛЬ
        </button>

    </div>


    <!-- GARAGE -->

    <div
        class="garage"
        id="garage"
    >

        <!--
            Машины появятся здесь
            автоматически через JS
        -->

    </div>


    <!-- INFO -->

    <div class="info-grid">

        <div class="info-card">

            <div class="info-label">
                АВТОМОБИЛЕЙ
            </div>

            <div
                class="info-value"
                id="carsCount"
            >
                0
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                В ГАРАЖЕ
            </div>

            <div
                class="info-value"
                id="garageCount"
            >
                0
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                ОБЩАЯ СТОИМОСТЬ
            </div>

            <div
                class="info-value"
                id="carsValue"
            >
                $ 0
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                МЕСТ ГАРАЖА
            </div>

            <div
                class="info-value"
            >
                3
            </div>

        </div>

    </div>

</main>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <div
            class="modal-title"
            id="modalTitle"
        >
            Автомобиль
        </div>

        <div
            class="modal-text"
            id="modalText"
        >
            Информация
        </div>

        <div class="modal-buttons">

            <button
                class="modal-button"
                onclick="closeModal()"
            >
                ОТМЕНА
            </button>

            <button
                class="modal-button primary"
                id="modalAction"
            >
                ОК
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const defaultGarage = [];


/* =========================================================
   LOAD GARAGE
========================================================= */

let garage =
    JSON.parse(
        localStorage.getItem(
            "gta_rp_garage"
        )
    )
    ||
    defaultGarage;


/* =========================================================
   FORMAT MONEY
========================================================= */

function money(value){

    return "$ " +
        Number(value)
        .toLocaleString("ru-RU");

}


/* =========================================================
   SAVE
========================================================= */

function saveGarage(){

    localStorage.setItem(
        "gta_rp_garage",
        JSON.stringify(garage)
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderGarage(){

    const container =
        document.getElementById(
            "garage"
        );

    container.innerHTML="";


    if(garage.length===0){

        container.innerHTML=`

            <div class="empty">

                <div class="empty-icon">
                    🚗
                </div>

                <div class="empty-title">
                    Гараж пуст
                </div>

                <div class="empty-text">
                    У вас пока нет личного автомобиля.
                    Купите свою первую машину,
                    чтобы начать передвижение по городу.
                </div>

                <button
                    class="empty-button"
                    onclick="openShop()"
                >
                    ОТКРЫТЬ АВТОСАЛОН
                </button>

            </div>

        `;

    }else{

        garage.forEach(
            (car,index)=>{

                const card =
                    document.createElement(
                        "div"
                    );

                card.className="car";

                card.innerHTML=`

                    <div class="car-image">

                        <div class="car-status">
                            ● В ГАРАЖЕ
                        </div>

                        🚘

                    </div>

                    <div class="car-body">

                        <div class="car-name">
                            ${car.name}
                        </div>

                        <div class="car-model">
                            ${car.model}
                        </div>

                        <div class="car-stats">

                            <div class="car-stat">

                                <div class="car-stat-label">
                                    ТОПЛИВО
                                </div>

                                <div class="car-stat-value">
                                    ${car.fuel || 100}%
                                </div>

                            </div>

                            <div class="car-stat">

                                <div class="car-stat-label">
                                    СОСТОЯНИЕ
                                </div>

                                <div class="car-stat-value">
                                    ${car.condition || 100}%
                                </div>

                            </div>

                            <div class="car-stat">

                                <div class="car-stat-label">
                                    НОМЕР
                                </div>

                                <div class="car-stat-value">
                                    ${car.plate || "—"}
                                </div>

                            </div>

                        </div>

                        <div class="car-actions">

                            <button
                                class="car-button primary"
                                onclick="spawnCar(${index})"
                            >
                                ВЫПУСТИТЬ
                            </button>

                            <button
                                class="car-button"
                                onclick="carInfo(${index})"
                            >
                                ИНФОРМАЦИЯ
                            </button>

                        </div>

                    </div>

                `;

                container.appendChild(
                    card
                );

            }
        );

    }


    document.getElementById(
        "carsCount"
    ).textContent =
        garage.length;


    document.getElementById(
        "garageCount"
    ).textContent =
        garage.length;


    const total =
        garage.reduce(
            (sum,car)=>
                sum +
                Number(car.price || 0),
            0
        );


    document.getElementById(
        "carsValue"
    ).textContent =
        money(total);

}


/* =========================================================
   SHOP
========================================================= */

function openShop(){

    showModal(
        "Автосалон",
        "Автосалон пока находится в разработке. Здесь появится каталог автомобилей, цены, характеристики и покупка.",
        "ПОНЯТНО",
        closeModal
    );

}


/* =========================================================
   SPAWN
========================================================= */

function spawnCar(index){

    const car =
        garage[index];

    showModal(
        "Автомобиль выпущен",
        `${car.name} (${car.plate || "без номера"}) отправлен из гаража. В полноценной игровой версии автомобиль появится рядом с персонажем.`,
        "В ИГРУ",
        ()=>{
            closeModal();
            window.location.href="game.html";
        }
    );

}


/* =========================================================
   CAR INFO
========================================================= */

function carInfo(index){

    const car =
        garage[index];

    showModal(
        car.name,
        `
            Модель: ${car.model}<br>
            Номер: ${car.plate || "—"}<br>
            Топливо: ${car.fuel || 100}%<br>
            Состояние: ${car.condition || 100}%<br>
            Стоимость: ${money(car.price || 0)}
        `,
        "ЗАКРЫТЬ",
        closeModal
    );

}


/* =========================================================
   MODAL
========================================================= */

function showModal(
    title,
    text,
    button,
    action
){

    document.getElementById(
        "modalTitle"
    ).textContent=title;

    document.getElementById(
        "modalText"
    ).innerHTML=text;

    const btn =
        document.getElementById(
            "modalAction"
        );

    btn.textContent=button;

    btn.onclick=action;

    document.getElementById(
        "modal"
    ).classList.add(
        "open"
    );

}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove(
        "open"
    );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href=
        "character.html";

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape")
            closeModal();

    }
);


/* =========================================================
   INIT
========================================================= */

renderGarage();

</script>

</body>
</html>
