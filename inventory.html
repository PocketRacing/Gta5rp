<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GTA RP — Инвентарь</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   INVENTORY
========================================================= */

.inventory-page{
    max-width:1250px;
    margin:auto;
    padding:30px;
}


/* HEADER */

.inventory-top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.inventory-title{
    font-size:27px;
    font-weight:900;
}

.inventory-subtitle{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
}


/* PLAYER BAR */

.player-bar{
    display:grid;
    grid-template-columns:
        1fr 1fr 1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.player-stat{
    padding:15px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
}

.player-stat-label{
    color:var(--muted);
    font-size:8px;
    font-weight:800;
}

.player-stat-value{
    margin-top:6px;
    font-size:15px;
    font-weight:900;
}


/* INVENTORY LAYOUT */

.inventory-layout{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:15px;
}


/* SIDEBAR */

.inventory-sidebar{
    padding:12px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel);
    height:max-content;
}

.category{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    border:1px solid transparent;
    border-radius:7px;

    background:transparent;
    color:#aab2ba;

    cursor:pointer;

    text-align:left;

    font-size:9px;
    font-weight:900;
}

.category:hover{
    background:var(--panel-2);
    color:white;
}

.category.active{
    border-color:#38553f;
    background:#18251c;
    color:var(--green);
}

.category-icon{
    width:24px;
    text-align:center;
    font-size:15px;
}

.category-count{
    margin-left:auto;
    color:#68727c;
}


/* INVENTORY CONTENT */

.inventory-content{
    min-width:0;
}

.inventory-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 17px;

    border:1px solid var(--border);
    border-bottom:0;

    border-radius:11px 11px 0 0;

    background:var(--panel);
}

.inventory-header-title{
    font-size:12px;
    font-weight:900;
}

.weight{
    color:var(--muted);
    font-size:9px;
}


/* GRID */

.inventory-grid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:8px;

    padding:12px;

    border:1px solid var(--border);

    border-radius:0 0 11px 11px;

    background:#0c1014;
}


/* ITEM */

.item{
    position:relative;

    min-height:145px;

    padding:10px;

    display:flex;
    flex-direction:column;

    border:1px solid var(--border);

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #151a20,
            #101419
        );

    cursor:pointer;

    transition:.15s;
}

.item:hover{
    border-color:#4a555e;
    transform:translateY(-2px);
}

.item.selected{
    border-color:var(--green);
    box-shadow:
        0 0 0 1px var(--green);
}

.item.empty{
    opacity:.3;
    cursor:default;
}

.item.empty:hover{
    transform:none;
    border-color:var(--border);
}


/* ITEM ICON */

.item-icon{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:43px;
}

.item-name{
    min-height:26px;

    color:#dce1e5;

    font-size:9px;
    font-weight:900;

    line-height:1.25;
}

.item-quantity{
    position:absolute;

    right:8px;
    top:8px;

    min-width:20px;

    padding:4px 5px;

    border-radius:5px;

    background:#080b0e;

    color:#fff;

    text-align:center;

    font-size:8px;
    font-weight:900;
}

.item-type{
    margin-top:4px;

    color:#68727c;

    font-size:7px;
}


/* DETAILS */

.item-details{
    display:none;

    margin-top:15px;

    padding:17px;

    border:1px solid var(--border);

    border-radius:10px;

    background:var(--panel);
}

.item-details.open{
    display:block;
}

.details-top{
    display:flex;
    gap:14px;
    align-items:center;
}

.details-icon{
    width:65px;
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:var(--panel-2);

    font-size:35px;
}

.details-name{
    font-size:16px;
    font-weight:900;
}

.details-description{
    margin-top:6px;
    color:var(--muted);
    font-size:9px;
    line-height:1.5;
}

.details-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.details-button{
    padding:10px 15px;

    border:1px solid var(--border);
    border-radius:7px;

    background:var(--panel-2);
    color:#fff;

    cursor:pointer;

    font-size:8px;
    font-weight:900;
}

.details-button.primary{
    border-color:var(--green);
    background:var(--green);
    color:#061008;
}

.details-button.danger{
    border-color:#59343a;
    background:#241417;
    color:#ff6671;
}


/* EMPTY */

.inventory-empty{
    grid-column:1/-1;

    min-height:300px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:var(--muted);
}

.inventory-empty-icon{
    font-size:48px;
    opacity:.7;
}

.inventory-empty-title{
    margin-top:12px;

    color:#d8dde0;

    font-size:14px;
    font-weight:900;
}

.inventory-empty-text{
    margin-top:7px;

    max-width:350px;

    font-size:9px;
    line-height:1.5;
}


/* SEARCH */

.search{
    width:180px;

    padding:9px 11px;

    border:1px solid var(--border);
    border-radius:6px;

    background:#0d1115;

    color:white;

    outline:none;

    font-size:9px;
}

.search:focus{
    border-color:#45604c;
}


/* MOBILE */

@media(max-width:950px){

    .inventory-grid{
        grid-template-columns:
            repeat(4,1fr);
    }

}

@media(max-width:750px){

    .inventory-layout{
        grid-template-columns:1fr;
    }

    .inventory-sidebar{
        display:flex;
        overflow-x:auto;
        gap:5px;
    }

    .category{
        width:auto;
        min-width:115px;
        flex-shrink:0;
    }

    .player-bar{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:550px){

    .inventory-page{
        padding:14px;
    }

    .inventory-top{
        align-items:flex-start;
        flex-direction:column;
    }

    .inventory-title{
        font-size:23px;
    }

    .inventory-header{
        align-items:flex-start;
        flex-direction:column;
        gap:10px;
    }

    .search{
        width:100%;
    }

    .inventory-grid{
        grid-template-columns:
            repeat(3,1fr);

        padding:8px;
    }

    .item{
        min-height:125px;
    }

    .item-icon{
        font-size:34px;
    }

}

@media(max-width:380px){

    .inventory-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header>

    <div class="logo">
        GTA <span>RP</span>
    </div>

    <div class="title">
        ИНВЕНТАРЬ
    </div>

    <div
        class="account"
        id="accountName"
    >
        Tomas_RP
    </div>

    <button
        class="back"
        onclick="goBack()"
    >
        ← НАЗАД
    </button>

</header>


<main class="inventory-page">


    <!-- ===================================================
         TITLE
    ==================================================== -->

    <div class="inventory-top">

        <div>

            <div class="inventory-title">
                Инвентарь
            </div>

            <div class="inventory-subtitle">
                Ваши предметы и личные вещи
            </div>

        </div>

    </div>


    <!-- ===================================================
         PLAYER STATS
    ==================================================== -->

    <div class="player-bar">

        <div class="player-stat">

            <div class="player-stat-label">
                ПЕРСОНАЖ
            </div>

            <div
                class="player-stat-value"
                id="playerName"
            >
                Tomas RP
            </div>

        </div>


        <div class="player-stat">

            <div class="player-stat-label">
                УРОВЕНЬ
            </div>

            <div
                class="player-stat-value"
                id="playerLevel"
            >
                1
            </div>

        </div>


        <div class="player-stat">

            <div class="player-stat-label">
                НАЛИЧНЫЕ
            </div>

            <div
                class="player-stat-value"
                id="playerCash"
            >
                $ 15 000
            </div>

        </div>


        <div class="player-stat">

            <div class="player-stat-label">
                ВЕС
            </div>

            <div
                class="player-stat-value"
                id="playerWeight"
            >
                0 / 30 кг
            </div>

        </div>

    </div>


    <!-- ===================================================
         INVENTORY
    ==================================================== -->

    <div class="inventory-layout">


        <!-- SIDEBAR -->

        <aside class="inventory-sidebar">

            <button
                class="category active"
                onclick="selectCategory('all',this)"
            >
                <span class="category-icon">
                    🎒
                </span>

                Все

                <span
                    class="category-count"
                    id="countAll"
                >
                    0
                </span>

            </button>


            <button
                class="category"
                onclick="selectCategory('food',this)"
            >
                <span class="category-icon">
                    🍔
                </span>

                Еда

                <span
                    class="category-count"
                    id="countFood"
                >
                    0
                </span>

            </button>


            <button
                class="category"
                onclick="selectCategory('medical',this)"
            >
                <span class="category-icon">
                    💊
                </span>

                Медицина

                <span
                    class="category-count"
                    id="countMedical"
                >
                    0
                </span>

            </button>


            <button
                class="category"
                onclick="selectCategory('documents',this)"
            >
                <span class="category-icon">
                    📄
                </span>

                Документы

                <span
                    class="category-count"
                    id="countDocuments"
                >
                    0
                </span>

            </button>


            <button
                class="category"
                onclick="selectCategory('tools',this)"
            >
                <span class="category-icon">
                    🔧
                </span>

                Инструменты

                <span
                    class="category-count"
                    id="countTools"
                >
                    0
                </span>

            </button>


            <button
                class="category"
                onclick="selectCategory('other',this)"
            >
                <span class="category-icon">
                    📦
                </span>

                Разное

                <span
                    class="category-count"
                    id="countOther"
                >
                    0
                </span>

            </button>

        </aside>


        <!-- CONTENT -->

        <section class="inventory-content">


            <div class="inventory-header">

                <div class="inventory-header-title">
                    ЛИЧНЫЕ ВЕЩИ
                </div>

                <input
                    class="search"
                    id="search"
                    placeholder="Поиск предмета..."
                    oninput="renderInventory()"
                >

            </div>


            <div
                class="inventory-grid"
                id="inventoryGrid"
            ></div>


            <!-- DETAILS -->

            <div
                class="item-details"
                id="itemDetails"
            >

                <div class="details-top">

                    <div
                        class="details-icon"
                        id="detailsIcon"
                    >
                        📦
                    </div>

                    <div>

                        <div
                            class="details-name"
                            id="detailsName"
                        >
                            Предмет
                        </div>

                        <div
                            class="details-description"
                            id="detailsDescription"
                        >
                            Описание предмета.
                        </div>

                    </div>

                </div>


                <div class="details-actions">

                    <button
                        class="details-button primary"
                        id="useButton"
                        onclick="useSelected()"
                    >
                        ИСПОЛЬЗОВАТЬ
                    </button>

                    <button
                        class="details-button"
                        onclick="closeDetails()"
                    >
                        ЗАКРЫТЬ
                    </button>

                    <button
                        class="details-button danger"
                        onclick="dropSelected()"
                    >
                        ВЫБРОСИТЬ
                    </button>

                </div>

            </div>

        </section>

    </div>

</main>


<script>

/* =========================================================
   CHARACTER
========================================================= */

const defaultCharacter={

    account:"Tomas_RP",

    name:"Tomas",

    surname:"RP",

    id:1,

    level:1,

    xp:350,

    cash:15000,

    bank:50000,

    job:"Безработный",

    hunger:82,

    thirst:91,

    vehicle:null

};


let character=

    JSON.parse(
        localStorage.getItem(
            "gta_rp_character"
        )
    )
    ||
    defaultCharacter;


/* =========================================================
   DEFAULT INVENTORY
========================================================= */

const defaultInventory=[

    {
        id:"phone",
        name:"Телефон",
        icon:"📱",
        category:"other",
        quantity:1,
        weight:.2,
        usable:true,
        description:
            "Личный мобильный телефон персонажа."
    },

    {
        id:"passport",
        name:"Паспорт",
        icon:"📕",
        category:"documents",
        quantity:1,
        weight:.1,
        usable:true,
        description:
            "Основной документ гражданина."
    },

    {
        id:"water",
        name:"Бутылка воды",
        icon:"💧",
        category:"food",
        quantity:3,
        weight:.5,
        usable:true,
        description:
            "Восстанавливает жажду персонажа."
    },

    {
        id:"burger",
        name:"Бургер",
        icon:"🍔",
        category:"food",
        quantity:2,
        weight:.4,
        usable:true,
        description:
            "Вкусный бургер. Восстанавливает голод."
    },

    {
        id:"bandage",
        name:"Бинт",
        icon:"🩹",
        category:"medical",
        quantity:2,
        weight:.2,
        usable:true,
        description:
            "Используется для восстановления здоровья."
    },

    {
        id:"repair",
        name:"Ремкомплект",
        icon:"🧰",
        category:"tools",
        quantity:1,
        weight:2,
        usable:true,
        description:
            "Комплект инструментов для ремонта автомобиля."
    },

    {
        id:"keys",
        name:"Ключи от дома",
        icon:"🔑",
        category:"other",
        quantity:1,
        weight:.1,
        usable:true,
        description:
            "Ключи от личного дома персонажа."
    },

    {
        id:"cash",
        name:"Наличные",
        icon:"💵",
        category:"other",
        quantity:1,
        weight:0,
        usable:false,
        description:
            "Наличные деньги персонажа."
    }

];


/* =========================================================
   LOAD INVENTORY
========================================================= */

let inventory=

    JSON.parse(
        localStorage.getItem(
            "gta_rp_inventory"
        )
    );


if(!inventory){

    inventory=
        defaultInventory;

    saveInventory();

}


/* =========================================================
   STATE
========================================================= */

let currentCategory="all";

let selectedItem=null;


/* =========================================================
   SAVE
========================================================= */

function saveInventory(){

    localStorage.setItem(

        "gta_rp_inventory",

        JSON.stringify(
            inventory
        )

    );

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

    return "$ "+
        Number(value)
        .toLocaleString(
            "ru-RU"
        );

}


/* =========================================================
   CATEGORY
========================================================= */

function selectCategory(
    category,
    button
){

    currentCategory=
        category;


    document
        .querySelectorAll(
            ".category"
        )
        .forEach(
            b=>
                b.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    closeDetails();

    renderInventory();

}


/* =========================================================
   RENDER
========================================================= */

function renderInventory(){

    const grid=
        document.getElementById(
            "inventoryGrid"
        );


    const search=
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let items=

        inventory.filter(
            item=>{

                const categoryOK=

                    currentCategory==="all"
                    ||
                    item.category===
                    currentCategory;


                const searchOK=

                    !search
                    ||
                    item.name
                        .toLowerCase()
                        .includes(search);


                return categoryOK &&
                       searchOK;

            }
        );


    grid.innerHTML="";


    if(items.length===0){

        grid.innerHTML=`

            <div class="inventory-empty">

                <div class="inventory-empty-icon">
                    🎒
                </div>

                <div class="inventory-empty-title">
                    Здесь пока пусто
                </div>

                <div class="inventory-empty-text">
                    В этой категории нет предметов.
                </div>

            </div>

        `;

    }else{

        items.forEach(
            item=>{

                const element=
                    document.createElement(
                        "div"
                    );


                element.className=
                    "item";


                if(
                    selectedItem &&
                    selectedItem.id===
                    item.id
                ){

                    element.classList.add(
                        "selected"
                    );

                }


                element.innerHTML=`

                    <div class="item-icon">
                        ${item.icon}
                    </div>

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-type">
                        ${categoryName(
                            item.category
                        )}
                    </div>

                    ${
                        item.quantity>1
                        ?
                        `
                        <div class="item-quantity">
                            ×${item.quantity}
                        </div>
                        `
                        :
                        ""
                    }

                `;


                element.onclick=
                    ()=>selectItem(item);


                grid.appendChild(
                    element
                );

            }
        );

    }


    updateCounts();

    updateWeight();

}


/* =========================================================
   SELECT ITEM
========================================================= */

function selectItem(item){

    selectedItem=
        item;


    document.getElementById(
        "detailsIcon"
    ).textContent=
        item.icon;


    document.getElementById(
        "detailsName"
    ).textContent=
        item.name;


    document.getElementById(
        "detailsDescription"
    ).innerHTML=
        item.description+
        "<br><br>"+
        "Количество: "+
        item.quantity+
        "<br>"+
        "Вес: "+
        item.weight+
        " кг";


    const useButton=
        document.getElementById(
            "useButton"
        );


    useButton.style.display=
        item.usable
        ? "block"
        : "none";


    document.getElementById(
        "itemDetails"
    ).classList.add(
        "open"
    );


    renderInventory();

}


/* =========================================================
   USE ITEM
========================================================= */

function useSelected(){

    if(!selectedItem)
        return;


    const item=
        selectedItem;


    if(!item.usable)
        return;


    switch(item.id){

        case "water":

            character.thirst=
                Math.min(
                    100,
                    character.thirst+25
                );

            consumeItem(item);

            showToast(
                "Вы выпили воду. Жажда восстановлена."
            );

            break;


        case "burger":

            character.hunger=
                Math.min(
                    100,
                    character.hunger+30
                );

            consumeItem(item);

            showToast(
                "Вы съели бургер. Голод восстановлен."
            );

            break;


        case "bandage":

            showToast(
                "Бинт использован. Здоровье восстановлено."
            );

            consumeItem(item);

            break;


        case "repair":

            showToast(
                "Ремкомплект готов к использованию возле автомобиля."
            );

            break;


        case "phone":

            showToast(
                "Телефон открыт. Скоро здесь появятся контакты и сообщения."
            );

            break;


        case "passport":

            showToast(
                "Паспорт: "+
                character.name+
                " "+
                character.surname+
                " • ID "+
                character.id
            );

            break;


        case "keys":

            showToast(
                "Ключи от дома у вас."
            );

            break;


        default:

            showToast(
                "Предмет использован."
            );

    }


    characterSave();

    saveInventory();

    renderInventory();

}


/* =========================================================
   CONSUME
========================================================= */

function consumeItem(item){

    item.quantity--;

    if(
        item.quantity<=0
    ){

        inventory=
            inventory.filter(
                i=>
                    i.id!==item.id
            );

        selectedItem=null;

        closeDetails();

    }

}


/* =========================================================
   DROP
========================================================= */

function dropSelected(){

    if(!selectedItem)
        return;


    const item=
        selectedItem;


    const confirmed=
        confirm(
            "Выбросить «"+
            item.name+
            "»?"
        );


    if(!confirmed)
        return;


    item.quantity--;


    if(
        item.quantity<=0
    ){

        inventory=
            inventory.filter(
                i=>
                    i.id!==item.id
            );

        selectedItem=null;

        closeDetails();

    }


    saveInventory();

    renderInventory();


    showToast(
        "Предмет выброшен."
    );

}


/* =========================================================
   DETAILS
========================================================= */

function closeDetails(){

    document.getElementById(
        "itemDetails"
    ).classList.remove(
        "open"
    );

}


/* =========================================================
   COUNTS
========================================================= */

function updateCounts(){

    const categories=[
        "food",
        "medical",
        "documents",
        "tools",
        "other"
    ];


    document.getElementById(
        "countAll"
    ).textContent=
        inventory.length;


    categories.forEach(
        category=>{

            const count=
                inventory.filter(
                    item=>
                        item.category===
                        category
                ).length;


            const element=
                document.getElementById(
                    "count"+
                    capitalize(
                        category
                    )
                );


            if(element){

                element.textContent=
                    count;

            }

        }
    );

}


/* =========================================================
   WEIGHT
========================================================= */

function updateWeight(){

    const weight=
        inventory.reduce(
            (sum,item)=>
                sum+
                (
                    Number(item.weight||0)*
                    Number(item.quantity||1)
                ),
            0
        );


    document.getElementById(
        "playerWeight"
    ).textContent=
        weight.toFixed(1)+
        " / 30 кг";

}


/* =========================================================
   CATEGORY NAME
========================================================= */

function categoryName(category){

    const names={

        food:"Еда",

        medical:"Медицина",

        documents:"Документы",

        tools:"Инструменты",

        other:"Разное"

    };


    return names[category]
        ||
        "Предмет";

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text){

    return text
        .charAt(0)
        .toUpperCase()+
        text.slice(1);

}


/* =========================================================
   CHARACTER SAVE
========================================================= */

function characterSave(){

    localStorage.setItem(

        "gta_rp_character",

        JSON.stringify(
            character
        )

    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const old=
        document.querySelector(
            ".inventory-toast"
        );


    if(old)
        old.remove();


    const toast=
        document.createElement(
            "div"
        );


    toast.className=
        "toast inventory-toast success";


    toast.textContent=
        message;


    document.body.appendChild(
        toast
    );


    setTimeout(
        ()=>{

            toast.remove();

        },
        3000
    );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href=
        "character.html";

}


/* =========================================================
   INIT
========================================================= */

document.getElementById(
    "accountName"
).textContent=
    character.account;


document.getElementById(
    "playerName"
).textContent=
    character.name+
    " "+
    character.surname;


document.getElementById(
    "playerLevel"
).textContent=
    character.level;


document.getElementById(
    "playerCash"
).textContent=
    money(
        character.cash
    );


renderInventory();


/* =========================================================
   AUTO SAVE
========================================================= */

setInterval(
    ()=>{

        saveInventory();

        characterSave();

    },
    5000
);

</script>
