<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>GTA RP — Server 1</title>

<style>

:root{
    --green:#4cff72;
    --bg:#080a0d;
    --panel:#101419;
    --panel2:#171c22;
    --border:#303740;
    --muted:#89929e;
    --blue:#6aa7ff;
    --gold:#ffd75a;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#080a0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button,
input{
    font:inherit;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen{
    position:fixed;
    inset:0;
    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.game-background{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 40%,
            #26342b 0%,
            #111914 35%,
            #080b0d 100%
        );
}

.game-background:before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.4),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.4)
        );

    pointer-events:none;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    align-items:center;

    padding:0 22px;

    z-index:20;

    background:
        linear-gradient(
            180deg,
            rgba(5,7,9,.94),
            rgba(5,7,9,.5),
            transparent
        );
}

.game-logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.game-logo span{
    color:var(--green);
}

.server-info{
    margin-left:20px;
    padding-left:20px;

    border-left:1px solid #353b42;
}

.server-number{
    font-size:12px;
    font-weight:900;
}

.server-status{
    margin-top:3px;
    color:var(--green);
    font-size:10px;
}

.top-right{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:9px;
}

.top-button{
    min-width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #3a4148;
    border-radius:10px;

    background:#090c0ed9;
    color:#fff;

    cursor:pointer;

    font-size:18px;

    transition:.18s;
}

.top-button:hover{
    border-color:var(--green);
    background:#11181a;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card{
    position:absolute;

    top:84px;
    left:22px;

    width:270px;

    z-index:15;

    padding:15px;

    background:
        linear-gradient(
            145deg,
            rgba(13,17,21,.96),
            rgba(8,11,14,.96)
        );

    border:1px solid #343b42;
    border-radius:13px;

    box-shadow:0 15px 50px #0008;

    backdrop-filter:blur(10px);
}

.player-main{
    display:flex;
    align-items:center;
    gap:12px;
}

.player-avatar{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#18241c;
    border:1px solid #304936;

    font-size:27px;
}

.player-name{
    font-size:16px;
    font-weight:900;
}

.player-id{
    margin-top:4px;

    color:#7f8995;
    font-size:11px;
}

.player-level{
    margin-top:3px;

    color:var(--green);
    font-size:11px;
}

.money-block{
    margin-top:15px;
    padding-top:13px;

    border-top:1px solid #272e35;
}

.money-line{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:6px;

    font-size:12px;
}

.money-value{
    font-weight:900;
}

.cash{
    color:var(--green);
}

.bank{
    color:var(--blue);
}

.status-list{
    margin-top:13px;
}

.status-row{
    margin-top:9px;
}

.status-header{
    display:flex;
    justify-content:space-between;

    color:#858f9a;
    font-size:9px;
}

.status-bar{
    width:100%;
    height:5px;

    margin-top:4px;

    background:#272c31;
    border-radius:5px;

    overflow:hidden;
}

.status-fill{
    height:100%;
    width:100%;
    background:var(--green);
}

.status-fill.hunger{
    background:#ffbd4a;
}

.status-fill.energy{
    background:var(--blue);
}


/* =========================================================
   CHARACTER
========================================================= */

.character-stage{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:5;

    text-align:center;
    pointer-events:none;
}

.character-glow{
    width:180px;
    height:180px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(76,255,114,.13),
            transparent 68%
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.character-icon{
    width:90px;
    height:125px;

    position:relative;

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.character-head{
    position:absolute;
    top:0;

    width:40px;
    height:40px;

    background:#d7a077;

    border:3px solid #111;
    border-radius:50%;
}

.character-body{
    width:62px;
    height:75px;

    background:#242d36;

    border:3px solid #0c0f12;

    border-radius:20px 20px 9px 9px;
}

.character-name{
    margin-top:8px;

    font-size:12px;
    font-weight:800;

    text-shadow:0 2px 5px #000;
}


/* =========================================================
   LOCATION
========================================================= */

.location-card{
    position:absolute;

    left:50%;
    bottom:150px;

    transform:translateX(-50%);

    z-index:10;

    text-align:center;

    padding:9px 15px;

    background:#080b0ddd;

    border:1px solid #343b42;
    border-radius:9px;

    backdrop-filter:blur(7px);
}

.location-name{
    font-size:12px;
    font-weight:900;
}

.location-street{
    margin-top:3px;

    color:#818b96;
    font-size:10px;
}


/* =========================================================
   CHAT
========================================================= */

.chat{
    position:absolute;

    left:22px;
    bottom:92px;

    width:370px;

    z-index:25;
}

.chat-window{
    height:145px;

    padding:11px;

    overflow:hidden;

    background:#050708b8;

    border-left:2px solid rgba(76,255,114,.45);
    border-radius:7px;

    font-size:12px;

    text-shadow:0 1px 2px #000;
}

.chat-message{
    margin-bottom:7px;
    line-height:1.3;
}

.chat-system{
    color:var(--green);
}

.chat-player{
    color:#fff;
}

.chat-command{
    color:#70a9ff;
}

.chat-input-row{
    display:flex;
    margin-top:6px;
}

.chat-input{
    flex:1;
    height:37px;

    border:1px solid #343b42;
    border-radius:7px 0 0 7px;

    background:#080b0dd9;
    color:white;

    padding:0 10px;

    outline:none;
}

.chat-input:focus{
    border-color:var(--green);
}

.chat-send{
    width:45px;

    border:0;
    border-radius:0 7px 7px 0;

    background:var(--green);
    color:#071008;

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   MINI MAP
========================================================= */

.minimap{
    position:absolute;

    right:22px;
    bottom:92px;

    width:180px;
    height:180px;

    z-index:20;

    border:3px solid rgba(255,255,255,.7);
    border-radius:50%;

    overflow:hidden;

    background:#161c20;

    box-shadow:0 8px 35px #000b;
}

.minimap img{
    width:100%;
    height:100%;

    object-fit:cover;

    transform:scale(1.35);
}

.minimap-dark{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle,
            transparent 30%,
            rgba(0,0,0,.28) 100%
        );
}

.minimap-player{
    position:absolute;

    left:50%;
    top:50%;

    width:10px;
    height:10px;

    transform:translate(-50%,-50%);

    background:#fff;

    border:2px solid #111;
    border-radius:50%;

    box-shadow:0 0 8px #fff;
}


/* =========================================================
   BOTTOM MENU
========================================================= */

.bottom-menu{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    z-index:30;

    display:flex;
    align-items:center;
    gap:7px;

    padding:7px;

    background:#080b0ee8;

    border:1px solid #343b42;
    border-radius:13px;

    box-shadow:0 10px 35px #0008;

    backdrop-filter:blur(10px);
}

.menu-button{
    min-width:72px;
    height:55px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    background:transparent;
    color:#89929e;

    border:0;
    border-radius:8px;

    cursor:pointer;

    transition:.18s;
}

.menu-button:hover,
.menu-button.active{
    color:#fff;
    background:#1b2228;
}

.menu-icon{
    font-size:19px;
}

.menu-text{
    font-size:9px;
    font-weight:700;
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

.notifications{
    position:absolute;

    top:90px;
    right:22px;

    z-index:50;

    width:280px;
}

.notification{
    margin-bottom:8px;

    padding:12px;

    background:#0b0f13ed;

    border:1px solid #343b42;
    border-left:3px solid var(--green);

    border-radius:8px;

    animation:notificationIn .25s ease;
}

.notification-title{
    font-weight:800;
    font-size:12px;
}

.notification-text{
    margin-top:4px;

    color:#89929e;
    font-size:11px;
}

@keyframes notificationIn{

    from{
        opacity:0;
        transform:translateX(30px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}


/* =========================================================
   MAP
========================================================= */

.map-overlay{
    position:absolute;
    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000d;

    padding:25px;
}

.map-overlay.open{
    display:flex;
}

.map-window{
    width:min(1150px,100%);
    height:min(800px,92vh);

    display:flex;
    flex-direction:column;

    background:#0b0e12;

    border:1px solid #3a424a;
    border-radius:15px;

    overflow:hidden;

    box-shadow:0 30px 100px #000;
}

.map-header{
    height:60px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#11161c;

    border-bottom:1px solid #303740;
}

.map-title{
    font-size:18px;
    font-weight:900;
}

.map-close{
    margin-left:auto;

    width:36px;
    height:36px;

    border:0;
    border-radius:8px;

    background:#252c33;

    color:white;

    font-size:20px;

    cursor:pointer;
}

.map-content{
    flex:1;

    position:relative;

    overflow:hidden;

    background:#101418;
}

.map-image{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    background:#111;
}

.map-side{
    position:absolute;

    right:15px;
    top:15px;

    width:210px;

    padding:12px;

    background:#080b0ee8;

    border:1px solid #353c43;
    border-radius:10px;
}

.map-side-title{
    font-size:12px;
    font-weight:900;

    margin-bottom:9px;
}

.map-place{
    width:100%;

    padding:9px;

    margin-top:6px;

    text-align:left;

    border:0;
    border-radius:7px;

    background:#181e24;

    color:#fff;

    cursor:pointer;

    font-size:11px;
}

.map-place:hover{
    background:#242c33;
}


/* =========================================================
   MODAL
========================================================= */

.quick-overlay{
    position:absolute;
    inset:0;

    z-index:90;

    display:none;

    align-items:center;
    justify-content:center;

    background:#0009;

    padding:20px;
}

.quick-overlay.open{
    display:flex;
}

.quick-window{
    width:min(440px,100%);

    max-height:80vh;

    overflow:auto;

    padding:22px;

    background:#101419;

    border:1px solid #3a424a;
    border-radius:14px;

    box-shadow:0 30px 90px #000;
}

.quick-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.quick-title{
    font-size:21px;
    font-weight:900;
}

.quick-close{
    background:none;
    border:0;

    color:#8b95a1;

    font-size:22px;

    cursor:pointer;
}

.quick-item{
    margin-top:10px;

    padding:14px;

    background:#171c22;

    border:1px solid #303740;
    border-radius:9px;
}

.quick-item strong{
    display:block;
}

.quick-item small{
    display:block;

    margin-top:5px;

    color:#818b97;

    line-height:1.4;
}

.quick-action{
    width:100%;

    margin-top:8px;

    padding:11px;

    border:0;
    border-radius:7px;

    background:#252c33;

    color:white;

    cursor:pointer;
}

.quick-action:hover{
    background:#313a43;
}

.quick-action.green{
    background:var(--green);
    color:#071008;
    font-weight:800;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{
        height:58px;
        padding:0 10px;
    }

    .game-logo{
        font-size:16px;
    }

    .server-info{
        display:none;
    }

    .top-button{
        min-width:38px;
        height:38px;
        font-size:16px;
    }

    .player-card{
        top:67px;
        left:9px;
        width:190px;
        padding:10px;
    }

    .player-avatar{
        width:39px;
        height:39px;
        font-size:20px;
    }

    .player-name{
        font-size:12px;
    }

    .player-id,
    .player-level{
        font-size:9px;
    }

    .money-block{
        margin-top:9px;
        padding-top:8px;
    }

    .status-list{
        margin-top:8px;
    }

    .status-row{
        margin-top:6px;
    }

    .character-glow{
        width:130px;
        height:130px;
    }

    .character-icon{
        transform:scale(.75);
    }

    .location-card{
        bottom:140px;
    }

    .chat{
        left:9px;
        bottom:83px;
        width:calc(100% - 190px);
        max-width:270px;
    }

    .chat-window{
        height:85px;
        font-size:10px;
    }

    .minimap{
        right:9px;
        bottom:83px;
        width:125px;
        height:125px;
    }

    .bottom-menu{
        bottom:8px;

        width:calc(100% - 16px);

        justify-content:space-around;

        gap:1px;

        padding:4px;
    }

    .menu-button{
        flex:1;
        min-width:0;
        height:52px;
    }

    .menu-icon{
        font-size:17px;
    }

    .menu-text{
        font-size:8px;
    }

    .notifications{
        top:65px;
        right:9px;
        width:200px;
    }

    .map-overlay{
        padding:8px;
    }

    .map-window{
        height:94vh;
    }

    .map-side{
        width:145px;
        right:8px;
        top:8px;
    }

}

@media(max-width:430px){

    .player-card{
        width:175px;
    }

    .chat{
        width:calc(100% - 175px);
    }

    .minimap{
        width:105px;
        height:105px;
    }

}

</style>
</head>

<body>


<div id="gameScreen">

    <div class="game-background"></div>


    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="topbar">

        <div class="game-logo">
            GTA <span>RP</span>
        </div>

        <div class="server-info">

            <div class="server-number">
                SERVER #1
            </div>

            <div class="server-status">
                ● ONLINE
            </div>

        </div>

        <div class="top-right">

            <button
                class="top-button"
                onclick="openMap()"
            >
                🗺️
            </button>

            <button
                class="top-button"
                onclick="openQuick('phone')"
            >
                📱
            </button>

            <button
                class="top-button"
                onclick="openQuick('inventory')"
            >
                🎒
            </button>

            <button
                class="top-button"
                onclick="openQuick('menu')"
            >
                ☰
            </button>

        </div>

    </div>


    <!-- =====================================================
         PLAYER
    ====================================================== -->

    <div class="player-card">

        <div class="player-main">

            <div class="player-avatar">
                👤
            </div>

            <div>

                <div
                    id="playerName"
                    class="player-name"
                >
                    Tomas RP
                </div>

                <div
                    id="playerId"
                    class="player-id"
                >
                    ID: 1
                </div>

                <div
                    id="playerLevel"
                    class="player-level"
                >
                    LEVEL 1
                </div>

            </div>

        </div>


        <div class="money-block">

            <div class="money-line">

                <span>Наличные</span>

                <span
                    id="cash"
                    class="money-value cash"
                >
                    $ 10 000
                </span>

            </div>

            <div class="money-line">

                <span>Банк</span>

                <span
                    id="bank"
                    class="money-value bank"
                >
                    $ 50 000
                </span>

            </div>

        </div>


        <div class="status-list">

            <div class="status-row">

                <div class="status-header">
                    <span>ЗДОРОВЬЕ</span>
                    <span id="healthValue">
                        100%
                    </span>
                </div>

                <div class="status-bar">
                    <div
                        id="healthBar"
                        class="status-fill"
                    ></div>
                </div>

            </div>


            <div class="status-row">

                <div class="status-header">
                    <span>ГОЛОД</span>
                    <span id="hungerValue">
                        88%
                    </span>
                </div>

                <div class="status-bar">

                    <div
                        id="hungerBar"
                        class="status-fill hunger"
                    ></div>

                </div>

            </div>


            <div class="status-row">

                <div class="status-header">
                    <span>ЭНЕРГИЯ</span>
                    <span id="energyValue">
                        92%
                    </span>
                </div>

                <div class="status-bar">

                    <div
                        id="energyBar"
                        class="status-fill energy"
                    ></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         CHARACTER
    ====================================================== -->

    <div class="character-stage">

        <div class="character-glow">

            <div class="character-icon">

                <div class="character-head"></div>

                <div class="character-body"></div>

            </div>

        </div>

        <div
            id="characterName"
            class="character-name"
        >
            Tomas RP
        </div>

    </div>


    <!-- =====================================================
         LOCATION
    ====================================================== -->

    <div class="location-card">

        <div class="location-name">
            ЛОС-САНТОС
        </div>

        <div class="location-street">
            Центральный район
        </div>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div class="chat">

        <div
            id="chatWindow"
            class="chat-window"
        >

            <div class="chat-message chat-system">
                [SERVER] Добро пожаловать на Server #1!
            </div>

            <div class="chat-message chat-system">
                [SERVER] Аккаунт авторизован.
            </div>

            <div class="chat-message">
                [SERVER] Приятной игры!
            </div>

        </div>


        <div class="chat-input-row">

            <input
                id="chatInput"
                class="chat-input"
                placeholder="Введите сообщение..."
                autocomplete="off"
            >

            <button
                class="chat-send"
                onclick="sendChat()"
            >
                ➤
            </button>

        </div>

    </div>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div class="minimap">

        <img
            src="assets/map.jpg"
            alt="Карта"
            onerror="this.style.display='none'"
        >

        <div class="minimap-dark"></div>

        <div class="minimap-player"></div>

    </div>


    <!-- =====================================================
         NOTIFICATIONS
    ====================================================== -->

    <div
        id="notifications"
        class="notifications"
    ></div>


    <!-- =====================================================
         BOTTOM
    ====================================================== -->

    <div class="bottom-menu">

        <button
            class="menu-button active"
            onclick="goHome()"
        >
            <span class="menu-icon">🏠</span>
            <span class="menu-text">ГОРОД</span>
        </button>


        <button
            class="menu-button"
            onclick="openMap()"
        >
            <span class="menu-icon">🗺️</span>
            <span class="menu-text">КАРТА</span>
        </button>


        <button
            class="menu-button"
            onclick="openPage('character.html')"
        >
            <span class="menu-icon">👤</span>
            <span class="menu-text">ПЕРСОНАЖ</span>
        </button>


        <button
            class="menu-button"
            onclick="openPage('vehicles.html')"
        >
            <span class="menu-icon">🚗</span>
            <span class="menu-text">АВТО</span>
        </button>


        <button
            class="menu-button"
            onclick="openPage('jobs.html')"
        >
            <span class="menu-icon">💼</span>
            <span class="menu-text">РАБОТА</span>
        </button>

    </div>


    <!-- =====================================================
         MAP WINDOW
    ====================================================== -->

    <div
        id="mapOverlay"
        class="map-overlay"
    >

        <div class="map-window">

            <div class="map-header">

                <div class="map-title">
                    🗺️ КАРТА ГОРОДА
                </div>

                <button
                    class="map-close"
                    onclick="closeMap()"
                >
                    ×
                </button>

            </div>


            <div class="map-content">

                <img
                    class="map-image"
                    src="assets/map.jpg"
                    alt="Карта GTA RP"
                >


                <div class="map-side">

                    <div class="map-side-title">
                        МЕСТА
                    </div>

                    <button
                        class="map-place"
                        onclick="mapLocation('Банк')"
                    >
                        🏦 Банк
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('Автосалон')"
                    >
                        🚗 Автосалон
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('АЗС')"
                    >
                        ⛽ АЗС
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('СТО')"
                    >
                        🔧 СТО
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('Магазин')"
                    >
                        🛒 Магазин
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('Работа')"
                    >
                        💼 Работы
                    </button>

                    <button
                        class="map-place"
                        onclick="mapLocation('Дом')"
                    >
                        🏠 Недвижимость
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         QUICK WINDOW
    ====================================================== -->

    <div
        id="quickOverlay"
        class="quick-overlay"
    >

        <div class="quick-window">

            <div class="quick-header">

                <div
                    id="quickTitle"
                    class="quick-title"
                >
                    Меню
                </div>

                <button
                    class="quick-close"
                    onclick="closeQuick()"
                >
                    ×
                </button>

            </div>


            <div id="quickContent"></div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   GTA RP — ЕДИНАЯ СИСТЕМА АВТОРИЗАЦИИ
========================================================= */


/*
    ВАЖНО!

    Эти ключи должны совпадать с index.html.
*/

const AUTH_KEY =
    "gta_rp_logged_in";

const ACCOUNT_KEY =
    "gta_rp_account";

const SERVER_KEY =
    "gta_rp_server";

const CHARACTER_KEY =
    "gta_rp_character";


/* =========================================================
   AUTH CHECK
========================================================= */

function checkAuthorization(){

    const loggedIn =
        localStorage.getItem(
            AUTH_KEY
        ) === "true";


    const account =
        localStorage.getItem(
            ACCOUNT_KEY
        );


    const server =
        localStorage.getItem(
            SERVER_KEY
        );


    /*
        Если пользователь не авторизован,
        отправляем его на index.
    */

    if(
        !loggedIn ||
        !account
    ){

        window.location.replace(
            "index.html"
        );

        return false;

    }


    /*
        Если сервер не выбран,
        также возвращаемся в index.
    */

    if(
        server !== "1"
    ){

        window.location.replace(
            "index.html"
        );

        return false;

    }


    return true;

}


/* =========================================================
   CHARACTER DATA
========================================================= */

let character = null;


function loadCharacter(){

    const saved =
        localStorage.getItem(
            CHARACTER_KEY
        );


    if(saved){

        try{

            character =
                JSON.parse(saved);

        }catch(error){

            character = null;

        }

    }


    /*
        Если персонаж ещё не создан,
        создаём его ОДИН раз.

        Это не сбрасывает аккаунт.
    */

    if(!character){

        character = {

            account:
                localStorage.getItem(
                    ACCOUNT_KEY
                ) || "Tomas_RP",

            name:"Tomas",

            surname:"RP",

            id:1,

            level:1,

            xp:0,

            cash:10000,

            bank:50000,

            health:100,

            hunger:88,

            energy:92,

            job:"Безработный"

        };


        saveCharacter();

    }

}


/* =========================================================
   SAVE
========================================================= */

function saveCharacter(){

    localStorage.setItem(

        CHARACTER_KEY,

        JSON.stringify(
            character
        )

    );

}


/* =========================================================
   PLAYER ID
========================================================= */

function getPlayerID(login){

    let total=0;


    for(
        let i=0;
        i<login.length;
        i++
    ){

        total +=
            login.charCodeAt(i);

    }


    return (
        (total % 9000) + 1
    );

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(value){

    return Number(
        value || 0
    ).toLocaleString(
        "ru-RU"
    );

}


/* =========================================================
   UPDATE
========================================================= */

function updatePlayer(){

    if(!character)
        return;


    const fullName =
        (
            character.name ||
            "Tomas"
        )+
        " "+
        (
            character.surname ||
            "RP"
        );


    document.getElementById(
        "playerName"
    ).textContent =
        fullName;


    document.getElementById(
        "characterName"
    ).textContent =
        fullName;


    document.getElementById(
        "playerId"
    ).textContent =
        "ID: "+
        getPlayerID(
            character.account ||
            "Tomas_RP"
        );


    document.getElementById(
        "playerLevel"
    ).textContent =
        "LEVEL "+
        (
            character.level ||
            1
        );


    document.getElementById(
        "cash"
    ).textContent =
        "$ "+
        formatMoney(
            character.cash
        );


    document.getElementById(
        "bank"
    ).textContent =
        "$ "+
        formatMoney(
            character.bank
        );


    const health =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    character.health
                )
            )
        );


    const hunger =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    character.hunger
                )
            )
        );


    const energy =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    character.energy
                )
            )
        );


    document.getElementById(
        "healthBar"
    ).style.width =
        health+"%";


    document.getElementById(
        "hungerBar"
    ).style.width =
        hunger+"%";


    document.getElementById(
        "energyBar"
    ).style.width =
        energy+"%";


    document.getElementById(
        "healthValue"
    ).textContent =
        health+"%";


    document.getElementById(
        "hungerValue"
    ).textContent =
        hunger+"%";


    document.getElementById(
        "energyValue"
    ).textContent =
        energy+"%";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        );

}


/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    addChat(
        character.name || "Tomas",
        text,
        "chat-player"
    );


    input.value="";

}


function addChat(
    name,
    text,
    type=""
){

    const chat =
        document.getElementById(
            "chatWindow"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "chat-message "+
        type;


    message.innerHTML =
        "["+
        escapeHTML(name)+
        "] "+
        escapeHTML(text);


    chat.appendChild(
        message
    );


    while(
        chat.children.length > 8
    ){

        chat.removeChild(
            chat.firstChild
        );

    }


    chat.scrollTop =
        chat.scrollHeight;

}


document
    .getElementById(
        "chatInput"
    )
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key ===
                "Enter"
            ){

                sendChat();

            }

        }
    );


/* =========================================================
   NOTIFICATION
========================================================= */

function notify(
    title,
    text
){

    const container =
        document.getElementById(
            "notifications"
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "notification";


    item.innerHTML = `

        <div class="notification-title">
            ${escapeHTML(title)}
        </div>

        <div class="notification-text">
            ${escapeHTML(text)}
        </div>

    `;


    container.appendChild(
        item
    );


    setTimeout(
        ()=>{

            item.style.opacity =
                "0";

            item.style.transform =
                "translateX(30px)";

            item.style.transition =
                ".25s";


            setTimeout(
                ()=>{
                    item.remove();
                },
                250
            );

        },
        3500
    );

}


/* =========================================================
   MAP
========================================================= */

function openMap(){

    document
        .getElementById(
            "mapOverlay"
        )
        .classList.add(
            "open"
        );

}


function closeMap(){

    document
        .getElementById(
            "mapOverlay"
        )
        .classList.remove(
            "open"
        );

}


function mapLocation(name){

    closeMap();


    notify(
        "Карта",
        "Выбрано: "+name
    );


    addChat(
        "NAV",
        "Маршрут построен: "+name,
        "chat-system"
    );

}


/* =========================================================
   QUICK
========================================================= */

function openQuick(type){

    const overlay =
        document.getElementById(
            "quickOverlay"
        );


    const title =
        document.getElementById(
            "quickTitle"
        );


    const content =
        document.getElementById(
            "quickContent"
        );


    overlay.classList.add(
        "open"
    );


    if(type==="menu"){

        title.textContent =
            "Игровое меню";


        content.innerHTML = `

            <div class="quick-item">

                <strong>
                    👤 Аккаунт
                </strong>

                <small>
                    ${escapeHTML(
                        localStorage.getItem(
                            ACCOUNT_KEY
                        )
                    )}
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    🖥️ Сервер
                </strong>

                <small>
                    Server #1
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    👤 Персонаж
                </strong>

                <small>
                    ${escapeHTML(
                        character.name+
                        " "+
                        character.surname
                    )}
                </small>

            </div>


            <button
                class="quick-action"
                onclick="openPage('character.html')"
            >
                ПЕРСОНАЖ
            </button>


            <button
                class="quick-action"
                onclick="openPage('inventory.html')"
            >
                ИНВЕНТАРЬ
            </button>


            <button
                class="quick-action"
                onclick="logout()"
            >
                ВЫЙТИ ИЗ АККАУНТА
            </button>

        `;

    }


    if(type==="inventory"){

        title.textContent =
            "Инвентарь";


        content.innerHTML = `

            <div class="quick-item">

                <strong>
                    📱 Телефон
                </strong>

                <small>
                    Личный мобильный телефон.
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    📄 Документы
                </strong>

                <small>
                    Паспорт и документы персонажа.
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    🔑 Ключи
                </strong>

                <small>
                    Ключи от личного транспорта.
                </small>

            </div>

        `;

    }


    if(type==="phone"){

        title.textContent =
            "Телефон";


        content.innerHTML = `

            <div class="quick-item">

                <strong>
                    📞 Контакты
                </strong>

                <small>
                    Контакты пока отсутствуют.
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    💬 Сообщения
                </strong>

                <small>
                    Новых сообщений нет.
                </small>

            </div>


            <div class="quick-item">

                <strong>
                    🚕 Такси
                </strong>

                <button
                    class="quick-action green"
                    onclick="callTaxi()"
                >
                    ВЫЗВАТЬ ТАКСИ
                </button>

            </div>

        `;

    }

}


function closeQuick(){

    document
        .getElementById(
            "quickOverlay"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   TAXI
========================================================= */

function callTaxi(){

    closeQuick();


    notify(
        "Такси",
        "Такси вызвано."
    );


    addChat(
        "DISPATCH",
        "Водитель направляется к вам.",
        "chat-system"
    );

}


/* =========================================================
   PAGE
========================================================= */

function openPage(page){

    window.location.href =
        page;

}


function goHome(){

    closeMap();
    closeQuick();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    /*
        Удаляем ТОЛЬКО сессию.

        Аккаунт и персонаж остаются.
        Поэтому после повторного входа
        Tomas_RP никуда не исчезает.
    */

    localStorage.removeItem(
        AUTH_KEY
    );


    window.location.replace(
        "index.html"
    );

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "Escape"
        ){

            closeMap();
            closeQuick();

        }

    }
);


/* =========================================================
   START
========================================================= */

if(
    checkAuthorization()
){

    loadCharacter();

    updatePlayer();


    setTimeout(
        ()=>{
            notify(
                "GTA RP",
                "Добро пожаловать, "+
                (
                    character.name+
                    " "+
                    character.surname
                )+
                "!"
            );
        },
        500
    );

}

</script>

</body>
</html>
